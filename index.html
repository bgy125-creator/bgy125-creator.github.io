const ALIAS={'단기투자자산처분이익':'단기매매증권처분이익','접대비':'기업업무추진비','컴퓨터소프트웨어':'소프트웨어','단기금융상품':'정기예금','단기예금':'정기예금'};

    mark=C.slots.map(s=>C.ans[s.side].includes(C.cards[s.v].t));
    ok=['d','k'].every(s=>user[s].length===C.ans[s].length&&C.ans[s].every(e=>user[s].includes(e)));
  }else if(C.type==='j'){
    if(C.slots.some(s=>s.v==null)){msg.textContent=SAY.empty;return}
    user={d:[],k:[]};
    for(const s of['d','k'])p[s].forEach((_,li)=>{const a=C.slots.find(x=>x.side===s&&x.line===li&&x.kind==='a'),m=C.slots.find(x=>x.side===s&&x.line===li&&x.kind==='m');user[s].push([C.cards[a.v].t,C.cards[m.v].v])});

    const A={d:mp(p.d.map(([a,v])=>[norm(a),v])),k:mp(p.k.map(([a,v])=>[norm(a),v]))};
    ok=same(mp(user.d),A.d)&&same(mp(user.k),A.k);
    mark={d:user.d.map(u=>({a:A.d[u[0]]!==undefined,m:A.d[u[0]]===u[1]})),k:user.k.map(u=>({a:A.k[u[0]]!==undefined,m:A.k[u[0]]===u[1]}))};

  S.tag[tag]=S.tag[tag]||{c:0,n:0};S.tag[tag].n++;if(ok)S.tag[tag].c++;
  if(!ok&&(C.type==='j'||C.type==='s')){for(const s of['d','k']){const ua=user[s].map(x=>x[0]),pa=p[s].map(x=>x[0]);

  {const pw=S.pw=S.pw||{},r=pw[p.q]=pw[p.q]||{n:0,w:0};r.n++;if(ok){r.s=(r.s||0)+1;if(r.w&&r.s>=2)r.ov=1}else{r.w++;r.s=0;r.ov=0}}
  G.res.push(ok);if(ok)G.ok++;

}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=s=>[...s].map(c=>{const n=c.charCodeAt(0)-44032;return n>=0&&n<11172?CHO[Math.floor(n/588)]:c}).join('');
// 보기: 정답 + 헷갈리는 용의자 → 같은 요소 → 나머지(단계 mx까지의 계정에서)
function mopts(a,n,mx){
  const pool=MA.filter(x=>x[2]<=mx).map(x=>x[0]).filter(x=>x!==a[0]);
  const c=shuf((MCONF[a[0]]||'').split(' ').filter(x=>pool.includes(x)));
  const same=shuf(pool.filter(x=>MBY[x][1]===a[1]&&!c.includes(x)));
  const rest=shuf(pool.filter(x=>!c.includes(x)&&!same.includes(x)));
  return [a[0],...[...c,...same,...rest].slice(0,n-1)].sort((x,y)=>x.localeCompare(y,'ko')); // 보기는 가나다 순
}
function mq(t,a,mx){
  if(t==='o3'||t==='o5')return {t:'o',a,opts:mopts(a,t==='o3'?3:5,mx)};
  if(t==='w'||t==='wn')return {t:'w',a,inp:'',hint:false,nohint:t==='wn'};
  return {t,a};
}
// 채권·채무 계정: 초보 탐정은 3개 이상, 정식 탐정은 5개 이상 꼭 나오게(맞을 때까지 다시 뽑음)
const MRP=['단기대여금','외상매출금','받을어음','미수금','선급금','매출채권','외상매입금','지급어음','단기차입금','미지급금','선수금','매입채무'];
const MRPN={2:3,3:5};
function mpick(st){
  for(let k=0;k<300;k++){const L=mpick1(st);if(L.filter(q=>MRP.includes(q.a[0])).length>=(MRPN[st]||0))return L}
  return mpick1(st);
}
function mpick1(st){
  const mx=st===5?3:2,L=[];
  // 1~3단계는 바구니 고르기가 쉬운 수익·비용보다 자산·부채 계정을 더 자주(무게 3:1로 뽑기)
  const wt=a=>st<=3&&(a[1]==='자산'||a[1]==='부채')?3:1;
  MPLAN[st].forEach(([t,ds,n])=>{
    const must=(MUST[st]||[]).map(k=>MBY[k]).filter(a=>a&&ds.includes(a[2])&&!L.some(q=>q.a===a));must.forEach(a=>L.push(mq(t,a,mx)));
    MA.filter(a=>ds.includes(a[2])&&!L.some(q=>q.a===a)).map(a=>[Math.pow(Math.random(),1/wt(a)),a]).sort((x,y)=>y[0]-x[0]).slice(0,n-must.length).forEach(([,a])=>L.push(mq(t,a,mx)))});
  return shuf(L);
}
let MG=null,MRES='',MWR=[];

function mansH(q){const a=q.a;

function mpickA(v){const q=MG.list[MG.i];if(q.done)return;q.pick=v;
  q.right=q.t==='g'?q.a[1]:q.t==='c'?q.a[4]:q.a[0];mgrade(v===q.right,v)}
function mcheckW(){const q=MG.list[MG.i];if(q.done)return;
  const v=q.inp.replace(/\s/g,'');if(!v){const m=document.getElementById('msg');if(m)m.textContent='계정과목을 써 줘!';return}
  mgrade([q.a[0],...(MALIAS[q.a[0]]||[])].includes(v),v)}
function mgrade(ok,v){
  const q=MG.list[MG.i],my=MY();q.done=true;q.ok=ok;
  const g=my.st.grp;g[q.a[1]]=g[q.a[1]]||{c:0,n:0};g[q.a[1]].n++;if(ok){g[q.a[1]].c++;MG.ok++}
  const ac=my.st.acc=my.st.acc||{},r=ac[q.a[0]]=ac[q.a[0]]||{c:0,n:0};r.n++;
  if(ok){r.c++;r.s=(r.s||0)+1;if(r.n>r.c&&r.s>=2)r.ov=1}else{r.s=0;r.ov=0}
  if(!ok){MG.wrong.push(q);if((q.t==='o'||q.t==='w')&&v){const k=q.a[0]+'|'+v;my.st.conf[k]=(my.st.conf[k]||0)+1}}

  const wrongIn=g=>Object.entries(acc).map(([k,v])=>({k,w:v.n-v.c,n:v.n,ov:v.ov})).filter(x=>x.w>0&&!x.ov&&MBY[x.k]&&MBY[x.k][1]===g).sort((a,b)=>b.w-a.w||a.n-b.n);
  const overIn=g=>Object.entries(acc).filter(([k,v])=>v.ov&&MBY[k]&&MBY[k][1]===g).map(([k])=>k);
  const sus=k=>Object.entries(S.conf).filter(([c])=>c.split('|')[0]===k).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c,n])=>`${esc(c.split('|')[1])}(${n}번)`).join(', ');

    ${GRPS.map(g=>{const r=rate(g),n=S.grp[g]?S.grp[g].n:0,L=wrongIn(g),O=overIn(g);return `<details class="gd"><summary><div class="br"><span>${GICON[g]} ${g}</span><div class="t"><i style="width:${r||0}%;background:${r==null?'transparent':r>=80?'var(--ok)':r>=60?'#3b82f6':'var(--ng)'}"></i></div><span class="v">${r==null?'-':r+'%'} · ${n}건 ▾</span></div></summary>

function mtrain(){
  const my=MY(),acc=my.st.acc||{};
  let L=Object.entries(acc).filter(([k,v])=>v.n>v.c&&!v.ov&&MBY[k]).sort((a,b)=>(b[1].n-b[1].c)-(a[1].n-a[1].c)).map(([k])=>MBY[k]).slice(0,10);
  // 5개보다 적으면 같은 요소의 다른 계정으로 채움
  if(L.length<5){const gs=new Set(L.map(a=>a[1]));L=[...L,...shuf(MA.filter(a=>gs.has(a[1])&&!L.includes(a))).slice(0,5-L.length)]}
  MG={mode:'train',st:0,list:shuf(L).map(a=>mq(a[2]===4?'c':'o5',a,3)),i:-1,ok:0,wrong:[]};mnext();
}

function setup(mode){
  mode=mode||'login';let sex=null;
  if(mode!=='join'&&mode!=='join2')JN=null;
  const tab=(m,l)=>`<button class="${mode===m||(m==='join'&&mode==='join2')?'on':''}" onclick="setup('${m}')">${l}</button>`;
  const pin=(id,ph,mt)=>`<input class="field" id="${id}" type="password" inputmode="numeric" maxlength="4" placeholder="${ph}" autocomplete="off"${mt?' style="margin-top:8px"':''}>`;
  const sch='<select class="field" id="sc" style="margin-bottom:8px"><option value="">학교 불러오는 중…</option></select>';
  const sx='<div class="lb">성별을 골라요</div><div class="pick sx"><button id="pm">남자</button><button id="pf">여자</button></div>';
  const body={
    guest:`<h2>체험하기</h2><div class="sm mut" style="margin-bottom:10px">로그인 없이 해 봐요. 기록은 이 기기에만 남고, 선생님은 볼 수 없어요.</div>
      <input class="field" id="nm" maxlength="10" placeholder="이름">${sx}`,
    login:`<h2>로그인</h2>${sch}
      <input class="field" id="sid" inputmode="numeric" maxlength="5" placeholder="학번 (예: 1101)" style="margin-bottom:8px">${pin('pin','PIN 숫자 4자리')}`,
    join:`<h2>회원 가입 <span class="sm mut">1/2</span></h2>${sch}
      <input class="field" id="sid" inputmode="numeric" maxlength="5" placeholder="학번 (예: 1101)" style="margin-bottom:8px">
      <input class="field" id="nm" maxlength="10" placeholder="이름" style="margin-bottom:8px">${pin('pin','PIN 숫자 4자리 정하기')}${pin('pin2','PIN 한 번 더',1)}`,
    join2:`<h2>회원 가입 <span class="sm mut">2/2</span></h2><div class="sm mut" style="margin-bottom:6px">${JN?esc(JN.scn+' · '+JN.sid+' '+JN.nm):''}</div>
      <div class="lb" style="margin-top:4px">우리 반을 골라요 <span style="font-weight:400">(선생님이 허용하면 반에 들어가요)</span></div><div class="rlist" id="rl"><div class="sm mut">반 목록 불러오는 중…</div></div>${sx}`};
  if(mode==='join2'&&!JN)mode='join';
  const label={guest:'게임 참여하기',login:'로그인',join:'다음',join2:'가입하고 시작하기'}[mode];
  let RL=[];
  app.innerHTML=`
  <div class="logo"><b>Econ Play</b><div class="mut sm">경제 고수를 꿈꾸며, 게임에 도전하세요!</div></div>
  <div class="seg">${tab('login','로그인')}${tab('join','회원 가입')}${tab('guest','체험하기')}</div>
  <div class="card">${body[mode]}
    <div class="msg" id="msg"></div>
    <button class="btn" id="go">${label}</button>
    ${mode==='join2'?`<button class="btn gh" onclick="setup('join')">← 이전으로</button>`:''}
    ${mode==='login'?'<div class="sm mut c" style="margin-top:10px">PIN을 잊었으면 선생님께 PIN 초기화를 부탁해요.</div>':''}
  </div>
  <div class="c"><button class="x" onclick="tpage()">🧑‍🏫 관리자 입장하기(교사)</button></div>`;
  const $=id=>document.getElementById(id),m=$('msg');
  if($('pm')){$('pm').onclick=()=>{sex='m';$('pm').classList.add('on');$('pf').classList.remove('on')};$('pf').onclick=()=>{sex='f';$('pf').classList.add('on');$('pm').classList.remove('on')}}
  if(mode==='join'&&JN){$('sid').value=JN.sid;$('nm').value=JN.nm}
  if(mode==='join2')schRooms(JN.sc).then(L=>{RL=L;const el=$('rl');if(el)el.innerHTML=L.length?L.map(r=>`<label><input type="radio" name="rq" value="${r.code}"><b>${esc(r.nm)}</b><span>${r.tn?esc(r.tn)+' 선생님':''}</span></label>`).join(''):'<div class="sm mut">아직 우리 학교에 가입할 수 있는 반이 없어요. 선생님께 알려 줘!</div>'}).catch(()=>{if($('rl'))$('rl').innerHTML='<div class="sm mut">반 목록을 불러오지 못했어요.</div>'});
  // 학교 목록 채우기(지난번에 고른 학교를 미리 골라 둔다)
  if($('sc'))fbInit().then(ok=>ok?schools():[]).then(L=>{const el=$('sc');if(!el)return;const pre=JN?JN.sc:lastSc();
    el.innerHTML=L.length?'<option value="">학교를 골라요</option>'+L.map(x=>`<option value="${x.c}"${x.c===pre?' selected':''}>${esc(x.nm)}</option>`).join(''):'<option value="">등록된 학교가 없어요</option>'}).catch(()=>{if($('sc'))$('sc').innerHTML='<option value="">학교를 불러오지 못했어요</option>'});
  $('go').onclick=async()=>{
    const v=id=>($(id)?$(id).value.trim():'');m.textContent='';
    if(mode==='guest'){const nm=v('nm');if(!nm)return m.textContent='이름을 써 줘!';if(!sex)return m.textContent='성별을 골라 줘!';
      if(!U.me||U.me.key)U=fresh();U.me={nm,sex};save();return main()}
    if(mode!=='join2'){
      if(!v('sc'))return m.textContent='학교를 골라 줘!';
      if(!/^[0-9]{4,5}$/.test(v('sid')))return m.textContent='학번을 숫자 4~5자리로 써 줘!';
      if(mode==='join'&&!v('nm'))return m.textContent='이름을 써 줘!';
      if(!/^[0-9]{4}$/.test(v('pin')))return m.textContent='PIN을 숫자 4자리로 써 줘!';
      if(mode==='join'&&v('pin')!==v('pin2'))return m.textContent='PIN 두 개가 서로 달라요!';
    }else{
      if(!document.querySelector('input[name=rq]:checked'))return m.textContent='우리 반을 골라 줘!';
      if(!sex)return m.textContent='성별을 골라 줘!';
    }
    if(!await fbInit())return m.textContent='인터넷에 연결되지 않았어요. 체험하기로 해 볼 수 있어요.';
    $('go').disabled=true;$('go').textContent='잠시만요…';
    const back=t=>{$('go').disabled=false;$('go').textContent=label;m.textContent=t};
    try{
      if(mode==='login'){lastSc(v('sc'));const r=await stLogin(v('sc'),v('sid'),v('pin'));
        if(r==='signup')return back('아직 가입하지 않은 학번이에요. 회원 가입을 먼저 해 줘!');
        if(r==='reset')alert('새 PIN으로 설정했어요. 다음부터 이 PIN으로 로그인해요.');
      }else if(mode==='join'){
        const sc=v('sc'),s0=(await schools()).find(x=>x.c===sc);
        if((await DB.doc('eLogins/'+sc+'_'+v('sid')).get()).exists)return back('이미 가입된 학번이에요. 로그인해 줘!');
        JN={sc,scn:s0?s0.nm:'',sid:v('sid'),nm:v('nm'),pin:v('pin')};lastSc(sc);return setup('join2');
      }else await stSignup(JN,document.querySelector('input[name=rq]:checked').value,sex);
      JN=null;main();
    }catch(e){
      const c=e&&e.code;
      back(c==='pin'?'PIN이 맞지 않아요.':c==='room'||c==='school'?'반을 다시 골라 줘!':c==='closed'?'지금은 새 학생을 받지 않는 반이에요.':c==='taken'?'이미 가입된 학번이에요. 로그인해 줘!':c==='no-record'?'기록을 찾지 못했어요. 선생님께 알려 줘!':errMsg(e));
    }
  };
}

// ───────── 선생님 화면
let TU=null,TD=null; // 로그인한 선생님, teachers 문서
const tTop=(back,title)=>`<div class="top"><div class="tb"><button class="x" onclick="${back}">←</button><span>${title}</span><span></span></div></div>`;
const tdate=t=>{if(!t)return '-';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()};
async function tpage(){
  if(!await fbInit()){app.innerHTML=tTop('main()','🧑‍🏫 선생님 화면')+'<div class="card">인터넷에 연결되지 않았어요.</div>';return}
  const u=FBA.currentUser;
  if(!u||u.isAnonymous||isStudent(u)){
    app.innerHTML=tTop("location.hash='';main()",'🧑‍🏫 선생님 화면')+`<div class="card c"><h2>🔐 선생님 로그인</h2>
      <div class="gw" style="margin-bottom:6px">반 방을 만들고 학생 기록을 보려면 구글 계정으로 로그인해요.${isStudent(u)?'<br>(지금 이 기기에 로그인한 학생은 로그아웃돼요.)':''}</div>
      <div class="msg" id="msg"></div><button class="btn bl" id="gl">구글로 로그인</button></div>`;
    document.getElementById('gl').onclick=async()=>{try{await FBA.signInWithPopup(new firebase.auth.GoogleAuthProvider());U=fresh();tpage()}catch(e){document.getElementById('msg').textContent='구글 로그인에 실패했어요. 다시 해 주세요.'}};
    return;
  }
  TU=u;
  try{const d=await DB.doc('teachers/'+u.uid).get();TD=d.exists?d.data():null}catch(e){TD=null}
  if(!TD&&u.email===MASTER){TD={nm:u.displayName||'마스터',em:u.email,t:Date.now(),st:'ok',lim:MLIM,er:0,br:0};await DB.doc('teachers/'+u.uid).set(TD)}
  if(!TD)return tInvite();
  if(TD.st==='ok'&&!TD.sc)return tSchool();
  if(TD.st!=='ok'){app.innerHTML=tTop("location.hash='';main()",'🧑‍🏫 선생님 화면')+`<div class="card c"><h2>⛔ 이용이 정지된 계정이에요</h2><div class="gw">마스터 선생님께 문의해 주세요.</div><button class="btn gh" onclick="tOut()">로그아웃</button></div>`;return}
  const m=location.hash.match(/^#teacher\/(\w+)/);if(m)return tRoom(m[1]);
  tHome();
}
async function tOut(){clearInterval(TRT);TRT=null;try{await FBA.signOut()}catch(e){}TU=TD=null;location.hash='';U=fresh();main()}
// 선생님 가입 요청: 보낸 뒤에는 기다림·거절 상태를 보여 준다
async function tInvite(){
  let rq=null;try{const d=await DB.doc('tReqs/'+TU.uid).get();rq=d.exists?d.data():null}catch(e){}
  const top=tTop("location.hash='';main()",'🧑‍🏫 선생님 가입');
  if(rq&&rq.st==='wait'){app.innerHTML=top+`<div class="card c"><h2>📮 가입 요청을 보냈어요</h2><div class="gw">마스터 선생님이 허용하면 바로 쓸 수 있어요.<br>허용된 뒤 이 화면을 새로고침해 주세요.</div>
    <div class="sm mut" style="margin-top:8px">${esc(rq.nm)} · ${esc(rq.scn)} · ${tdate(rq.t)} 요청</div>
    <button class="btn" onclick="tpage()">새로고침</button><button class="btn gh" onclick="tReqDel()">요청 취소</button><button class="btn gh" onclick="tOut()">로그아웃</button></div>`;return}
  if(rq&&rq.st==='no'){app.innerHTML=top+`<div class="card c"><h2>가입 요청이 받아들여지지 않았어요</h2><div class="gw">궁금한 점은 마스터 선생님께 문의해 주세요.</div>
    <button class="btn" onclick="tReqDel(1)">다시 요청하기</button><button class="btn gh" onclick="tOut()">로그아웃</button></div>`;return}
  app.innerHTML=top+`<div class="card"><h2>📮 선생님 가입 요청</h2>
    <div class="gw" style="margin-bottom:10px">${esc(TU.email)} 계정으로 로그인했어요. 가입 요청을 보내면 마스터 선생님이 확인하고 허용해요.</div>
    <input class="field" id="nm" maxlength="20" placeholder="이름" value="${esc(TU.displayName||'')}" style="margin-bottom:8px">
    <input class="field" id="scn" maxlength="30" placeholder="학교 이름 (정식 이름)" style="margin-bottom:8px">
    <input class="field" id="memo" maxlength="200" placeholder="한마디 (선택, 예: 담당 과목)">
    <div class="msg" id="msg"></div><button class="btn" id="go">가입 요청 보내기</button><button class="btn gh" onclick="tOut()">로그아웃</button></div>`;
  document.getElementById('go').onclick=async()=>{
    const v=id=>document.getElementById(id).value.trim(),m=document.getElementById('msg');
    if(!v('nm'))return m.textContent='이름을 써 주세요.';if(v('scn').length<2)return m.textContent='학교 이름을 써 주세요.';
    try{await DB.doc('tReqs/'+TU.uid).set({nm:v('nm'),em:TU.email,t:Date.now(),scn:v('scn'),memo:v('memo'),st:'wait'});tInvite()}
    catch(e){m.textContent='요청을 보내지 못했어요. 다시 해 주세요.'}
  };
}
async function tReqDel(again){try{await DB.doc('tReqs/'+TU.uid).delete()}catch(e){}again?tInvite():tOut()}
// 학교 이름 칸(이미 등록된 학교는 목록에서 고를 수 있게)
const schField=()=>`<input class="field" id="scn" maxlength="30" list="schl" placeholder="학교 이름 (정식 이름)"><datalist id="schl">${(SCH||[]).map(x=>`<option value="${esc(x.nm)}">`).join('')}</datalist><div class="sm mut" style="margin-top:4px">줄이지 말고 정식 이름으로 써 주세요. 학생은 로그인할 때 이 이름을 골라요.</div>`;
async function tSchool(){
  await schools().catch(()=>[]);
  app.innerHTML=tTop("location.hash='';main()",'🏫 학교 등록')+`<div class="card"><h2>🏫 우리 학교</h2><div class="gw" style="margin-bottom:10px">반을 만들기 전에 학교를 한 번 정해요.</div>${schField()}<div class="msg" id="msg"></div><button class="btn" id="go">학교 정하기</button><button class="btn gh" onclick="tOut()">로그아웃</button></div>`;
  document.getElementById('go').onclick=async()=>{const nm=document.getElementById('scn').value.trim(),m=document.getElementById('msg');
    if(nm.length<2)return m.textContent='학교 이름을 써 주세요.';
    const key=nm.replace(/\s+/g,'');if(!(SCH||[]).some(x=>x.nm.replace(/\s+/g,'')===key)&&!confirm(`'${nm}'을(를) 새 학교로 등록할까요?\n목록에 우리 학교가 있으면 [취소]를 누르고 목록에서 골라 주세요.`))return;
    try{const sc=await schoolOf(nm);await DB.doc('teachers/'+TU.uid).update({sc:sc.c,scn:sc.nm});tpage()}catch(e){m.textContent='학교를 정하지 못했어요. 다시 해 주세요.'}};
}
// 선생님 첫 화면. 마스터 계정은 맨 위 탭으로 마스터 화면 / 선생님 화면(다른 선생님과 같은 화면)을 오간다
let TTAB=null,MTAB='inv',MTU=null; // 큰 탭(m 마스터·t 선생님), 마스터 안쪽 탭, 선생님 관리에서 보고 있는 선생님
const MTABS=[['inv','📮 가입 요청'],['tch','🧑‍🏫 선생님 관리'],['sch','🏫 학교 관리']];
async function tHome(){
  clearInterval(TRT);TRT=null;setHash('#teacher');
  const isM=TU.email===MASTER;TTAB=isM?(TTAB||'m'):'t';
  const head=tTop("location.hash='';main()",isM&&TTAB==='m'?'👑 마스터 화면':'🧑‍🏫 선생님 화면')+`<div class="card c"><div class="who" style="margin:0">${esc(TD.nm)} 선생님${isM?' 👑':''}</div><div class="sm mut">🏫 ${esc(TD.scn||'')} · ${esc(TU.email)}</div></div>`
    +(isM?`<div class="seg" style="grid-template-columns:1fr 1fr"><button class="${TTAB==='m'?'on':''}" onclick="TTAB='m';tHome()">👑 마스터 화면</button><button class="${TTAB==='t'?'on':''}" onclick="TTAB='t';tHome()">🧑‍🏫 선생님 화면</button></div>`:'');
  if(TTAB==='m'){
    app.innerHTML=head+`<div class="seg mtab">${MTABS.map(([k,l])=>`<button class="${MTAB===k?'on':''}" onclick="MTAB='${k}';MTU=null;tHome()">${l}</button>`).join('')}</div><div id="mb"><div class="card sm mut">불러오는 중…</div></div><button class="btn gh" onclick="tOut()">로그아웃</button>`;
    return MTAB==='inv'?mInv():MTAB==='sch'?mSchools():MTU?mTeacher(MTU):mTeachers();
  }
  app.innerHTML=head+`
  <div class="card"><h3>📚 우리 반</h3><div id="rl" class="sm mut">불러오는 중…</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input class="field" id="rn" maxlength="20" placeholder="반 이름 (예: 1학년 1반)"><button class="btn" style="width:auto;margin:0;padding:0 16px;white-space:nowrap" onclick="tMkRoom()">반 만들기</button></div>
    <div class="msg" id="rm"></div></div>
  <div class="card"><h3>🐂 Bull Run</h3><div class="sm mut" id="bl">불러오는 중…</div>
    <a class="btn bl" style="text-align:center;text-decoration:none" href="${BR_URL}invest-race.html#host" target="_blank" rel="noopener">진행자 화면 열기</a></div>
  <div class="card"><h3>📊 오늘 사용 현황</h3><div id="us" class="sm mut">불러오는 중…</div></div>
  <button class="btn gh" onclick="tOut()">로그아웃</button>`;
  // 내 반 방
  try{const sn=await DB.collection('eRooms').where('owner','==',TU.uid).get();const L=sn.docs.map(d=>Object.assign({code:d.id},d.data())).sort((a,b)=>a.t-b.t);
    // 학교를 정하기 전에 만든 반에는 선생님 학교를 붙인다
    for(const r of L)if(!r.sc&&TD.sc){await DB.doc('eRooms/'+r.code).update({sc:TD.sc}).catch(()=>{});r.sc=TD.sc}
    for(const r of L)if(r.tn!==TD.nm)await DB.doc('eRooms/'+r.code).update({tn:TD.nm}).catch(()=>{});
    const RQ={};try{(await DB.collection('eStudents').where('rqt','==',TU.uid).get()).docs.forEach(d=>{const q=d.data().rq;if(q)RQ[q]=(RQ[q]||0)+1})}catch(e){}
    document.getElementById('rl').innerHTML=(L.length?L.map(r=>`<button class="rrow" onclick="tRoom('${r.code}')"><b>${esc(r.nm)}</b><span>학생 ${r.n}/${r.lim}명${r.closed?' · 🔒 새 학생 받지 않음':''}${RQ[r.code]?` · <b style="color:var(--ac)">📮 가입 요청 ${RQ[r.code]}명</b>`:''}</span></button>`).join(''):'아직 만든 반이 없어요.')+`<div class="sm mut" style="margin-top:6px">반 방 ${L.length}/${TD.lim.er}개</div>`}catch(e){document.getElementById('rl').textContent='반 목록을 불러오지 못했어요.'}
  // Bull Run 방(30일 지난 방은 정리)
  try{const L=await brRooms(TU.uid);let n=0;for(const r of L)if(Date.now()-(+r.t||0)>BR_DAYS*864e5){await brDel(r);n++}
    document.getElementById('bl').innerHTML=`내 Bull Run 방 ${L.length-n}/${TD.lim.br}개 · 방마다 최대 ${TD.lim.bp}명<br>방은 만든 지 ${BR_DAYS}일이 지나면 자동으로 지워져요.${n?`<br>오늘 ${n}개를 정리했어요.`:''}`}catch(e){document.getElementById('bl').textContent='Bull Run 방을 불러오지 못했어요.'}
  // 오늘 현황
  try{const q=DB.collection('eStudents').where('tu','==',TU.uid);const all=await qCount(q),td=await qCount(q.where('day','==',today()));
    document.getElementById('us').innerHTML=`우리 반 학생 <b>${all}</b>명 중 오늘 접속 <b>${td}</b>명<br>${useLine(td)}`}catch(e){document.getElementById('us').textContent='현황을 불러오지 못했어요.'}
}

function stSum(x){
  const u=x.U||{},d=u.dojo||{best:0,dan:0},my=u.my||{clear:0,st:{grp:{}}};
  const sum=o=>Object.values(o||{}).reduce((a,v)=>[a[0]+(v.c||0),a[1]+(v.n||0)],[0,0]);
  const tg={};Object.values((u.st||{}).tag||{}).forEach(o=>Object.entries(o).forEach(([k,v])=>{tg[k]=tg[k]||{c:0,n:0};tg[k].c+=v.c;tg[k].n+=v.n}));
  const j=sum(tg),a=sum((my.st||{}).grp),pc=s=>s[1]?Math.round(s[0]/s[1]*100)+'%':'-';
  return {bi:d.best||0,di:mclr(my),rank:d.best===6?`검은띠(${d.dan||1}단)`:`${BELT[d.best||0].nm}(${BELT[d.best||0].g})`,belt:d.best===6?(d.dan||1)+'단 검은띠':BELT[d.best||0].nm,det:MLV[mclr(my)][1],
    med:Object.values(u.cup||{}).filter(c=>medal(c.n)).length,jr:pc(j),ar:pc(a),tg,pf:u.perf||{}};
}

function tCsv(){
  const pf=(x,u,m)=>{const r=pfRec(x,u,m);return r&&r.s?[r.c||0,r.lt?r.n+'/'+r.N:'',r.lt?r.l+'/'+r.N:'',r.s-(r.c||0)]:[0,'','',0]};
  const ph=PERF.flatMap(pu=>PFC.flatMap(([m,nm])=>[`수행평가 ${pu.u} ${nm} 통과 횟수`,'최고','최근','실패·중단 횟수']));
  const rows=[['학번','이름','띠','탐정 레벨','메달','분개 정답률','계정 정답률','최근 접속',...ph]].concat(TR.S.map(x=>[x.sid,x.nm,x.s.belt,x.s.det,x.s.med,x.s.jr,x.s.ar,x.day||'',...PERF.flatMap(pu=>PFC.flatMap(([m])=>pf(x,pu.u,m)))]));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=TR.r.nm+'.csv';a.click();
}
async function tDelRoom(){
  if(!confirm(`${TR.r.nm}(학생 ${TR.S.length}명)을 지울까요? 되돌릴 수 없어요.\n학생 계정과 학생 본인의 기록은 남아요.`))return;
  try{await erDel(TR.r.code,TR.r.owner);TR.r.owner===TU.uid?tHome():mTeacher(TR.r.owner)}catch(e){document.getElementById('msg').textContent='지우지 못했어요.'}
}

  const L=(await DB.collection('tReqs').get()).docs.map(d=>Object.assign({uid:d.id},d.data())).sort((a,b)=>(a.st==='wait'?0:1)-(b.st==='wait'?0:1)||b.t-a.t);

async function mReqOk(uid){
  const d=await DB.doc('tReqs/'+uid).get();if(!d.exists)return mInv();const x=d.data();
  if(!confirm(`${x.nm} 선생님(${x.em})의 가입을 허용할까요?`))return;
  try{const b=DB.batch();b.set(DB.doc('teachers/'+uid),{nm:x.nm,em:x.em,t:Date.now(),st:'ok',lim:TLIM,er:0,br:0});b.delete(DB.doc('tReqs/'+uid));await b.commit();mInv()}catch(e){alert('허용하지 못했어요.')}
}
async function mReqNo(uid){if(!confirm('이 가입 요청을 거절할까요?'))return;try{await DB.doc('tReqs/'+uid).update({st:'no'});mInv()}catch(e){alert('거절하지 못했어요.')}}
async function mReqDel(uid){try{await DB.doc('tReqs/'+uid).delete();mInv()}catch(e){}}

// ───────── 마스터: 선생님 관리
async function mTeachers(){
  MTU=null;const mb=mbx('tch');if(!mb)return;
  mb.innerHTML='<div class="card" id="tl">불러오는 중…</div>';
  // 30일 지난 Bull Run 방은 모든 선생님 것까지 정리
  try{const rs=await DB.collection('rooms').get();for(const d of rs.docs){const r=Object.assign({id:d.id},d.data());if(Date.now()-(+r.t||0)>BR_DAYS*864e5)await brDel(r)}}catch(e){}
  const sn=await DB.collection('teachers').get();
  const L=sn.docs.map(d=>Object.assign({uid:d.id},d.data())).sort((a,b)=>a.t-b.t);
  const all=await qCount(DB.collection('eStudents')),td=await qCount(DB.collection('eStudents').where('day','==',today()));
  document.getElementById('tl').innerHTML=`<h3>선생님 ${L.length}명</h3>`+L.map(x=>`<button class="rrow" onclick="mTeacher('${x.uid}')"><b>${esc(x.nm)}${x.em===MASTER?' 👑':''} ${x.st==='ok'?'':'<span class="pill b">정지</span>'}</b><span>${esc(x.scn||'학교 미정')} · ${esc(x.em)} · 반 방 ${x.er}/${x.lim.er} · Bull Run 방 ${x.br}/${x.lim.br}</span></button>`).join('');
  mb.insertAdjacentHTML('beforeend',`<div class="card"><h3>📊 전체 현황</h3><div class="sm">Econ Play 학생 <b>${all}</b>명 · 오늘 접속 <b>${td}</b>명<br>${useLine(td)}<br>저장 공간: 약 ${Math.max(1,Math.round(all*10/1024))}MB / 1GB</div><a class="btn gh" style="text-align:center;text-decoration:none" href="https://console.firebase.google.com/project/bullrun-b29a5/usage" target="_blank" rel="noopener">Firebase 사용량 보기</a></div>`);
}
let MT=null;

  const er=(await DB.collection('eRooms').where('owner','==',uid).get()).docs.map(d=>Object.assign({code:d.id},d.data()));
  const br=(await brRooms(uid)).sort((a,b)=>b.t-a.t);MT={x,br};
  const left=r=>Math.max(0,BR_DAYS-Math.floor((Date.now()-(+r.t||0))/864e5));
  mb.innerHTML=`<button class="x" onclick="mTeachers()">← 선생님 목록</button>
  <div class="card c"><div class="who" style="margin:0">${esc(x.nm)} ${x.st==='ok'?'':'<span class="pill b">정지</span>'}</div><div class="sm mut">${esc(x.em)} · ${tdate(x.t)} 등록</div>
    ${x.em===MASTER?'':`<div class="row2"><button class="btn ${x.st==='ok'?'gh':''}" onclick="mStop(${x.st==='ok'})">${x.st==='ok'?'⛔ 정지':'✅ 정지 풀기'}</button><button class="btn gh" style="color:var(--ng)" onclick="mDelT()">🗑️ 선생님 삭제</button></div>`}</div>
  <div class="card"><h3>제한</h3><div class="lim">
    <label>반 방 수<input class="field" id="l_er" inputmode="numeric" value="${x.lim.er}"></label><label>반당 학생(최대 30)<input class="field" id="l_es" inputmode="numeric" value="${x.lim.es}"></label>
    <label>Bull Run 방 수<input class="field" id="l_br" inputmode="numeric" value="${x.lim.br}"></label><label>방당 참가자<input class="field" id="l_bp" inputmode="numeric" value="${x.lim.bp}"></label></div>
    <button class="btn" onclick="mLim()">제한 저장</button><div class="sm mut" style="margin-top:6px">이미 만든 방의 인원 제한은 그대로이고, 새로 만드는 방부터 적용돼요.</div></div>
  <div class="card"><h3>📚 Econ Play 반 방 (${er.length})</h3>${er.length?er.map(r=>`<div class="wl" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button class="x" style="color:var(--tx);text-align:left" onclick="tRoom('${r.code}')"><b>${esc(r.nm)}</b><br><span class="sm mut">${r.code} · 학생 ${r.n}명 · ${tdate(r.t)}</span></button><button class="mini2" onclick="mDelER('${r.code}',${r.n})">🗑️</button></div>`).join(''):'<div class="sm mut">없어요.</div>'}</div>
  <div class="card"><h3>🐂 Bull Run 방 (${br.length})</h3>${br.length?br.map((r,i)=>`<div class="wl" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><label style="flex:1"><input type="checkbox" class="bk" value="${i}"> <b>${esc(r.name)}</b><br><span class="sm mut">참가자 ${r.n||0}명 · ${tdate(r.t)} · ${left(r)}일 남음</span></label><button class="mini2" onclick="mDelBR([${i}])">🗑️</button></div>`).join('')+`<div class="row2"><button class="btn gh" onclick="mDelBR([...document.querySelectorAll('.bk:checked')].map(e=>+e.value))">고른 방 지우기</button><button class="btn gh" style="color:var(--ng)" onclick="mDelBR(MT.br.map((r,i)=>i))">모두 지우기</button></div>`:'<div class="sm mut">없어요.</div>'}</div>`;
}
async function mStop(stop){await DB.doc('teachers/'+MT.x.uid).update({st:stop?'stop':'ok'});mTeacher(MT.x.uid)}
async function mLim(){
  const g=k=>Math.max(0,parseInt(document.getElementById('l_'+k).value,10)||0);
  await DB.doc('teachers/'+MT.x.uid).update({lim:{er:g('er'),es:Math.min(ES_MAX,g('es')),br:g('br'),bp:g('bp')}});alert('저장했어요.');mTeacher(MT.x.uid);
}
async function mDelER(code,n){if(!confirm(`이 반 방(학생 ${n}명)을 지울까요? 학생 기록은 남아요.`))return;await erDel(code,MT.x.uid);mTeacher(MT.x.uid)}
async function mDelBR(ix){
  const L=ix.map(i=>MT.br[i]).filter(Boolean);if(!L.length)return alert('지울 방을 골라 주세요.');
  if(!confirm(`Bull Run 방 ${L.length}개를 지울까요? 방 안의 기록도 함께 지워져요.`))return;
  for(const r of L)await brDel(r);mTeacher(MT.x.uid);
}
async function mDelT(){
  const x=MT.x;if(!confirm(`${x.nm} 선생님을 삭제할까요?\n선생님 권한이 없어지고, 만든 반 방과 Bull Run 방도 모두 지워져요(학생 기록은 남아요).`))return;
  const er=(await DB.collection('eRooms').where('owner','==',x.uid).get()).docs;for(const d of er)await erDel(d.id,x.uid);
  for(const r of MT.br)await brDel(r);
  await DB.doc('teachers/'+x.uid).delete();mTeachers();
}

async function mSchools(){
  const mb=mbx('sch');if(!mb)return;
  mb.innerHTML='<div class="card" id="sl">불러오는 중…</div>';
  SCH=null;const L=await schools();
  const T=(await DB.collection('teachers').get()).docs.map(d=>d.data());
  const rows=[];for(const x of L){const t=T.filter(y=>y.sc===x.c).length,r=await qCount(DB.collection('eRooms').where('sc','==',x.c)),st=await qCount(DB.collection('eStudents').where('sc','==',x.c));rows.push({x,t,r,st})}
  document.getElementById('sl').innerHTML=`<h3>학교 ${L.length}곳</h3><div class="sm mut" style="margin-bottom:6px">같은 학교가 두 번 등록됐으면, 쓰지 않는 쪽(선생님·반·학생 0)을 지워 주세요.</div>`+(rows.length?rows.map(o=>`<div class="wl"><b>${esc(o.x.nm)}</b><div class="sm mut">선생님 ${o.t}명 · 반 ${o.r}개 · 학생 ${o.st}명 · ${tdate(o.x.t)} 등록</div>
    <button class="mini2" onclick="mSchRen('${esc(o.x.c)}')">✏️ 이름 고치기</button> ${o.t||o.r||o.st?'':`<button class="mini2" style="color:var(--ng)" onclick="mSchDel('${esc(o.x.c)}')">🗑️ 지우기</button>`}</div>`).join(''):'<div class="sm mut">등록된 학교가 없어요.</div>');
}
async function mSchRen(c){
  const x=SCH.find(y=>y.c===c);if(!x)return;const nm=(prompt('새 학교 이름(정식 이름)',x.nm)||'').trim();
  if(nm.length<2||nm===x.nm)return;
  try{
    await DB.doc('schools/'+x.id).update({nm});
    // 선생님·학생 기록에 적어 둔 학교 이름도 함께 바꾼다
    const ups=[...(await DB.collection('teachers').where('sc','==',c).get()).docs,...(await DB.collection('eStudents').where('sc','==',c).get()).docs];
    for(let i=0;i<ups.length;i+=400){const b=DB.batch();ups.slice(i,i+400).forEach(d=>b.update(d.ref,{scn:nm}));await b.commit()}
    if(TD&&TD.sc===c)TD.scn=nm;mSchools();
  }catch(e){alert('이름을 바꾸지 못했어요.')}
}
async function mSchDel(c){
  const x=SCH.find(y=>y.c===c);if(!x||!confirm(`'${x.nm}'을(를) 지울까요?`))return;
  try{await DB.doc('schools/'+x.id).delete();mSchools()}catch(e){alert('지우지 못했어요.')}
